<!DOCTYPE html>

<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="試算工具">
    <meta name="theme-color" content="#1e3a5f">
    <link rel="manifest" href="/Tools/manifest.json">
    <link rel="apple-touch-icon" href="/Tools/icon-192.png">
    <title>試算工具</title>
    <style>
        :root { --primary-color: #1e3a5f; --accent-color: #2563eb; --bg-color: #f0f4f8; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 350px; }
        h1 { color: var(--primary-color); font-size: 1.8rem; margin-bottom: 2rem; letter-spacing: 2px; }
        .btn { display: block; padding: 18px; margin: 15px 0; background-color: var(--primary-color); color: white; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; transition: all 0.3s ease; }
        .btn:hover { background-color: var(--accent-color); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(37,99,235,0.3); }
        .footer { margin-top: 25px; font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>試算工具</h1>
        <a href="price.html" class="btn">價格建議工具</a>
        <a href="tax.html" class="btn">貸款稅務試算</a>
        <div class="footer"></div>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/Tools/sw.js')
                .then(() => console.log('SW 已註冊'))
                .catch(err => console.log('SW 失敗', err));
        }
    </script>
</body>
</html>
